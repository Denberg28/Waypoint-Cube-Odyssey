name: Waypoint Gemini Beta Tester Council

on:
  workflow_dispatch:
  schedule:
    - cron: "5 * * * *"

permissions:
  contents: write

env:
  GEMINI_MODEL: gemini-3.5-flash-lite
  GEMINI_SAFE_INPUT_TOKENS: "32000"
  GEMINI_SAFE_OUTPUT_TOKENS: "4096"
  GEMINI_SAFE_RPM: "1"
  GEMINI_MAX_RETRIES: "1"
  GEMINI_MAX_REQUESTS_PER_RUN: "8"

jobs:
  beta-council:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: waypoint-gemini-api
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ai-development
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Preflight autonomous council code
        run: |
          python -m py_compile ai_lab/common.py ai_lab/should_run_beta.py ai_lab/beta_testers.py ai_lab/world_architect.py ai_lab/milestone_governor.py ai_lab/codex_backlog.py
      - name: Check governed beta council cadence
        id: budget
        env:
          BETA_TESTER_ENABLED: ${{ vars.BETA_TESTER_ENABLED || 'true' }}
          BETA_MAX_DAILY_COUNCILS: "24"
        run: |
          python ai_lab/should_run_beta.py && echo "run_council=true" >> "$GITHUB_OUTPUT" || echo "run_council=false" >> "$GITHUB_OUTPUT"
      - name: Sync aggregate public playtest telemetry
        if: steps.budget.outputs.run_council == 'true'
        continue-on-error: true
        run: python -m ai_lab.sync_public_telemetry
      - name: Run six Gemini Flash-Lite beta tester agents
        if: steps.budget.outputs.run_council == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m ai_lab.beta_testers
      - name: Resolve council with World Architect & Cartographer
        if: steps.budget.outputs.run_council == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m ai_lab.world_architect
      - name: Evaluate milestone locks and cadence
        if: steps.budget.outputs.run_council == 'true'
        run: python -m ai_lab.milestone_governor
      - name: Generate Codex engineering handoff queue
        if: steps.budget.outputs.run_council == 'true'
        run: python -m ai_lab.codex_backlog
      - name: Install test dependencies
        if: steps.budget.outputs.run_council == 'true'
        run: python -m pip install -r requirements-dev.txt
      - name: Run AI lab tests
        if: steps.budget.outputs.run_council == 'true'
        run: python -m pytest tests_ai_lab -q
      - name: Commit governed beta evidence and Codex queue
        if: steps.budget.outputs.run_council == 'true'
        run: |
          git config user.name "waypoint-beta-council[bot]"
          git config user.email "waypoint-beta-council[bot]@users.noreply.github.com"
          git add beta_feedback runtime/beta_council.json runtime/telemetry_snapshot.json runtime/world_map.json runtime/development_governance.json reports/BETA_COUNCIL_LATEST.md reports/WORLD_ARCHITECT_LATEST.md reports/DEVELOPMENT_GOVERNANCE.md codex_backlog
          git diff --cached --quiet && exit 0
          git commit -m "ai: governed beta council and milestone handoff"
          git push origin ai-development
