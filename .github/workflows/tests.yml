name: Tests
on:
  push:
  pull_request:
jobs:
  python-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest tests_ai_lab -q
      - run: python tools/repo_sanity.py
      - run: python -m py_compile ai_lab/*.py ai_gamemaster/*.py streamlit_lab/*.py streamlit_app.py tools/*.py
