name: Deploy Godot Web Tester

on:
  workflow_dispatch:
  push:
    branches:
      - ai-development
    paths:
      - "project.godot"
      - "export_presets.cfg"
      - "main.tscn"
      - "scripts/**"
      - "assets/**"
      - "game_data/**"
      - "runtime/music_profile.json"
      - "runtime/public_telemetry.json"
      - ".github/workflows/godot-web-pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: godot-web-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout ai-development
        uses: actions/checkout@v7

      - name: Install Godot 4.7.2
        run: |
          set -euo pipefail
          GODOT_VERSION="4.7.2"
          wget -q "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -O godot.zip
          unzip -q godot.zip
          chmod +x "Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          godot --version

      - name: Install Godot export templates
        run: |
          set -euo pipefail
          GODOT_VERSION="4.7.2"
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          wget -q "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -O templates.tpz
          unzip -q templates.tpz
          mkdir -p "$TEMPLATE_DIR"
          cp -R templates/. "$TEMPLATE_DIR/"
          echo "Installed Web templates:"
          ls -lh "$TEMPLATE_DIR"/web*.zip
          test -f "$TEMPLATE_DIR/web_nothreads_release.zip"

      - name: Import project resources
        run: godot --headless --path . --import

      - name: Export actual Godot game for Web
        run: |
          set -euo pipefail
          mkdir -p build/web
          SHORT_SHA="${GITHUB_SHA::12}"
          BASENAME="waypoint-${SHORT_SHA}"
          godot --headless --verbose --path . --export-release "Web" "build/web/${BASENAME}.html"

          test -f "build/web/${BASENAME}.html"
          test -f "build/web/${BASENAME}.wasm"
          test -f "build/web/${BASENAME}.pck"

          # Serve a stable index.html while retaining commit-hashed Godot assets.
          # This prevents the browser from reusing an older .pck/.wasm bundle
          # after a successful Pages deployment.
          cp "build/web/${BASENAME}.html" build/web/index.html
          rm "build/web/${BASENAME}.html"

          python - <<'PY'
          from pathlib import Path
          import os, json, datetime

          index = Path("build/web/index.html")
          text = index.read_text(encoding="utf-8")
          stamp = os.environ["GITHUB_SHA"][:12]
          meta = (
              '<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">\n'
              '<meta http-equiv="Pragma" content="no-cache">\n'
              '<meta http-equiv="Expires" content="0">\n'
              f'<!-- Waypoint build {stamp} -->\n'
          )
          if "<head>" in text:
              text = text.replace("<head>", "<head>\n" + meta, 1)
          else:
              text = meta + text
          index.write_text(text, encoding="utf-8")

          Path("build/web/version.json").write_text(
              json.dumps({
                  "commit": os.environ["GITHUB_SHA"],
                  "short_commit": stamp,
                  "built_utc": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              }, indent=2),
              encoding="utf-8",
          )
          PY

          touch build/web/.nojekyll
          echo "Published Godot build assets:"
          ls -lh build/web

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/web

      - name: Deploy Godot Web tester
        id: deployment
        uses: actions/deploy-pages@v5
