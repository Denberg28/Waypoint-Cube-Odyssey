name: Deploy Godot Web Tester

on:
  workflow_dispatch:
  push:
    branches:
      - ai-development
    paths:
      - "project.godot"
      - "export_presets.cfg"
      - "main.tscn"
      - "scripts/**"
      - "assets/**"
      - "game_data/**"
      - ".github/workflows/godot-web-pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: godot-web-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout ai-development
        uses: actions/checkout@v4

      - name: Install Godot 4.7.2
        run: |
          set -euo pipefail
          GODOT_VERSION="4.7.2"
          wget -q "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -O godot.zip
          unzip -q godot.zip
          chmod +x "Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          godot --version

      - name: Install Godot export templates
        run: |
          set -euo pipefail
          GODOT_VERSION="4.7.2"
          wget -q "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -O templates.tpz
          unzip -q templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          cp -R templates/. "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"

      - name: Import project resources
        run: godot --headless --path . --import

      - name: Export actual Godot game for Web
        run: |
          mkdir -p build/web
          godot --headless --path . --export-release "Web" build/web/index.html
          test -f build/web/index.html
          test -f build/web/index.wasm
          test -f build/web/index.pck
          touch build/web/.nojekyll
          ls -lh build/web

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: Deploy Godot Web tester
        id: deployment
        uses: actions/deploy-pages@v4
