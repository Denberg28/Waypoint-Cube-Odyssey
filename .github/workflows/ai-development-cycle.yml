name: Waypoint AI Development Cycle

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

env:
  GEMINI_MODEL: gemini-3.5-flash-lite
  GEMINI_SAFE_INPUT_TOKENS: "32000"
  GEMINI_SAFE_OUTPUT_TOKENS: "4096"
  GEMINI_SAFE_RPM: "1"
  GEMINI_MAX_RETRIES: "1"
  GEMINI_MAX_REQUESTS_PER_RUN: "4"

jobs:
  cycle:
    runs-on: ubuntu-latest
    concurrency:
      group: waypoint-gemini-api
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ai-development
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check cycle budget
        id: budget
        env:
          AI_CYCLE_ENABLED: ${{ vars.AI_CYCLE_ENABLED || 'true' }}
          AI_MAX_DAILY_CYCLES: ${{ vars.AI_MAX_DAILY_CYCLES || '8' }}
        run: |
          python ai_lab/should_run.py && echo "run_cycle=true" >> "$GITHUB_OUTPUT" || echo "run_cycle=false" >> "$GITHUB_OUTPUT"
      - name: Sync aggregate public playtest telemetry
        if: steps.budget.outputs.run_cycle == 'true'
        continue-on-error: true
        run: python -m ai_lab.sync_public_telemetry
      - name: Run Gemini GM + beta-informed development analysis
        if: steps.budget.outputs.run_cycle == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m ai_lab.cycle
      - name: Generate Codex engineering handoff queue
        if: steps.budget.outputs.run_cycle == 'true'
        run: python -m ai_lab.codex_backlog
      - name: Install test dependencies
        if: steps.budget.outputs.run_cycle == 'true'
        run: python -m pip install -r requirements-dev.txt
      - name: Run contract tests
        if: steps.budget.outputs.run_cycle == 'true'
        run: python -m pytest tests_ai_lab -q
      - name: Commit safe generated state and Codex handoff
        if: steps.budget.outputs.run_cycle == 'true'
        run: |
          git config user.name "waypoint-ai-gm[bot]"
          git config user.email "waypoint-ai-gm[bot]@users.noreply.github.com"
          git add runtime/ai_world_state.json runtime/telemetry_snapshot.json generated_content reports codex_backlog
          git diff --cached --quiet && exit 0
          git commit -m "ai: beta-informed development cycle and Codex handoff"
          git push origin ai-development
