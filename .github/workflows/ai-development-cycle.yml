name: Waypoint AI Development Cycle

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

env:
  GEMINI_MODEL: gemini-3.5-flash-lite
  GEMINI_SAFE_INPUT_TOKENS: "32000"
  GEMINI_SAFE_OUTPUT_TOKENS: "4096"
  GEMINI_SAFE_RPM: "1"
  GEMINI_MAX_RETRIES: "1"
  GEMINI_MAX_REQUESTS_PER_RUN: "4"
  FREE_TIER_ONLY: "true"

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: waypoint-gemini-api
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ai-development
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Preflight autonomous development code
        run: |
          python -m py_compile ai_lab/common.py ai_lab/autonomy_guard.py ai_lab/should_run.py ai_lab/cycle.py ai_lab/milestone_governor.py ai_lab/codex_backlog.py
      - name: Enforce subscription and zero-cost guard
        id: autonomy
        env:
          CHATGPT_PLUS_END_UTC: ${{ vars.CHATGPT_PLUS_END_UTC }}
          GEMINI_FREE_TIER_CONFIRMED: ${{ vars.GEMINI_FREE_TIER_CONFIRMED || 'false' }}
        run: |
          python ai_lab/autonomy_guard.py || true
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          s=json.loads(Path("runtime/autonomy_guard.json").read_text())
          print("basic_gemini_allowed=" + str(s["basic_gemini_allowed"]).lower())
          print("chatgpt_development_allowed=" + str(s["chatgpt_development_allowed"]).lower())
          PY
      - name: Stop paid-quality autonomous development in safety window
        if: steps.autonomy.outputs.chatgpt_development_allowed != 'true'
        run: echo "ChatGPT/Codex-class developmental autonomy is locked. Basic confirmed-free Gemini may remain available."
      - name: Check governed development cadence
        id: budget
        if: steps.autonomy.outputs.chatgpt_development_allowed == 'true' && steps.autonomy.outputs.basic_gemini_allowed == 'true'
        env:
          AI_CYCLE_ENABLED: ${{ vars.AI_CYCLE_ENABLED || 'true' }}
          AI_MAX_DAILY_CYCLES: ${{ vars.AI_MAX_DAILY_CYCLES || '8' }}
        run: |
          python ai_lab/should_run.py && echo "run_cycle=true" >> "$GITHUB_OUTPUT" || echo "run_cycle=false" >> "$GITHUB_OUTPUT"
      - name: Sync aggregate public playtest telemetry
        if: steps.budget.outputs.run_cycle == 'true'
        continue-on-error: true
        run: python -m ai_lab.sync_public_telemetry
      - name: Run Gemini GM + beta-informed development analysis
        if: steps.budget.outputs.run_cycle == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m ai_lab.cycle
      - name: Refresh milestone governance
        if: steps.budget.outputs.run_cycle == 'true'
        run: python -m ai_lab.milestone_governor
      - name: Generate Codex engineering handoff queue
        if: steps.budget.outputs.run_cycle == 'true'
        run: python -m ai_lab.codex_backlog
      - name: Install test dependencies
        if: steps.budget.outputs.run_cycle == 'true'
        run: python -m pip install -r requirements-dev.txt
      - name: Run contract tests
        if: steps.budget.outputs.run_cycle == 'true'
        run: python -m pytest tests_ai_lab -q
      - name: Commit governed generated state and Codex handoff
        if: steps.budget.outputs.run_cycle == 'true'
        run: |
          git config user.name "waypoint-ai-gm[bot]"
          git config user.email "waypoint-ai-gm[bot]@users.noreply.github.com"
          git add runtime/ai_world_state.json runtime/telemetry_snapshot.json runtime/development_governance.json runtime/autonomy_guard.json generated_content reports codex_backlog
          git diff --cached --quiet && exit 0
          git commit -m "ai: governed development cycle and Codex handoff"
          git push origin ai-development
