name: Waypoint AI Music Director

on:
  workflow_dispatch:
  schedule:
    # Twice daily. Scheduled execution is activated by the mirrored workflow on
    # the repository default branch; this copy remains the development source.
    - cron: "37 18 * * *"

permissions:
  contents: write

env:
  GEMINI_MODEL: gemini-3.5-flash-lite
  GEMINI_SAFE_INPUT_TOKENS: "24000"
  GEMINI_SAFE_OUTPUT_TOKENS: "3072"
  GEMINI_SAFE_RPM: "1"
  GEMINI_MAX_RETRIES: "0"
  GEMINI_MAX_REQUESTS_PER_RUN: "1"
  GEMINI_MAX_REQUESTS_PER_DAY: "3"
  GEMINI_DAILY_USAGE_FILE: "runtime/gemini_daily_usage.json"
  GEMINI_ECONOMY_MODE: "true"

jobs:
  music-director:
    runs-on: ubuntu-latest
    concurrency:
      group: waypoint-gemini-api
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ai-development
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Sync aggregate public playtest telemetry
        continue-on-error: true
        run: python -m ai_lab.sync_public_telemetry
      - name: Run Gemini Flash-Lite Music Director
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m ai_lab.music_agent
      - name: Validate Python modules
        run: python -m py_compile ai_lab/music_agent.py ai_lab/sync_public_telemetry.py ai_lab/common.py
      - name: Commit bounded music profile
        run: |
          git config user.name "waypoint-music-director[bot]"
          git config user.email "waypoint-music-director[bot]@users.noreply.github.com"
          git add runtime/music_profile.json runtime/telemetry_snapshot.json runtime/gemini_daily_usage.json reports/MUSIC_DIRECTOR_LATEST.md
          git diff --cached --quiet && exit 0
          git commit -m "ai: update bounded procedural music profile"
          git push origin ai-development
