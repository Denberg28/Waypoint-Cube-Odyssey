name: Waypoint AI Music Director
on:
  workflow_dispatch:
  schedule:
    - cron: "37 2,8,14,20 * * *"
permissions:
  contents: write
jobs:
  music-director:
    runs-on: ubuntu-latest
    concurrency:
      group: waypoint-ai-music-director
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai-development
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sync aggregate public playtest telemetry
        continue-on-error: true
        run: python -m ai_lab.sync_public_telemetry
      - name: Run Gemini Flash-Lite Music Director
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.5-flash-lite
        run: python -m ai_lab.music_agent
      - name: Validate Python modules
        run: python -m py_compile ai_lab/music_agent.py ai_lab/sync_public_telemetry.py
      - name: Commit bounded music profile
        run: |
          git config user.name "waypoint-music-director[bot]"
          git config user.email "waypoint-music-director[bot]@users.noreply.github.com"
          git add runtime/music_profile.json runtime/telemetry_snapshot.json reports/MUSIC_DIRECTOR_LATEST.md
          git diff --cached --quiet && exit 0
          git commit -m "ai: update bounded procedural music profile"
          git push origin ai-development
