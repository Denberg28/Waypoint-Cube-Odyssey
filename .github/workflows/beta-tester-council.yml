name: Waypoint Gemini Beta Tester Council

on:
  workflow_dispatch:
  schedule:
    - cron: "5 12 * * *"

permissions:
  contents: write

env:
  GEMINI_MODEL: gemini-3.5-flash-lite
  GEMINI_SAFE_INPUT_TOKENS: "32000"
  GEMINI_SAFE_OUTPUT_TOKENS: "4096"
  GEMINI_SAFE_RPM: "1"
  GEMINI_MAX_RETRIES: "0"
  GEMINI_MAX_REQUESTS_PER_RUN: "1"
  GEMINI_MAX_REQUESTS_PER_DAY: "3"
  GEMINI_DAILY_USAGE_FILE: "runtime/gemini_daily_usage.json"
  GEMINI_ECONOMY_MODE: "true"
  FREE_TIER_ONLY: "true"
  AUTONOMY_STOP_THRESHOLD: "3"

jobs:
  beta-council:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: waypoint-gemini-api
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ai-development
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Preflight autonomous council code
        run: |
          python -m py_compile ai_lab/common.py ai_lab/autonomy_guard.py ai_lab/should_run_beta.py ai_lab/beta_testers.py ai_lab/world_architect.py ai_lab/milestone_governor.py ai_lab/codex_backlog.py ai_lab/development_review.py
      - name: Enforce zero-cost Gemini guard
        id: autonomy
        env:
          CHATGPT_PLUS_END_UTC: ${{ vars.CHATGPT_PLUS_END_UTC }}
          GEMINI_FREE_TIER_CONFIRMED: ${{ vars.GEMINI_FREE_TIER_CONFIRMED || 'false' }}
        run: |
          python ai_lab/autonomy_guard.py || true
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          s=json.loads(Path("runtime/autonomy_guard.json").read_text())
          print("basic_gemini_allowed=" + str(s["basic_gemini_allowed"]).lower())
          PY
      - name: Check governed beta council cadence
        id: budget
        if: steps.autonomy.outputs.basic_gemini_allowed == 'true'
        env:
          BETA_TESTER_ENABLED: ${{ vars.BETA_TESTER_ENABLED || 'true' }}
          BETA_MAX_DAILY_COUNCILS: "1"
        run: |
          python ai_lab/should_run_beta.py && echo "run_council=true" >> "$GITHUB_OUTPUT" || echo "run_council=false" >> "$GITHUB_OUTPUT"
      - name: Sync aggregate public playtest telemetry
        if: steps.budget.outputs.run_council == 'true'
        continue-on-error: true
        run: python -m ai_lab.sync_public_telemetry
      - name: Run six Gemini Flash-Lite beta tester agents
        id: beta_request
        if: steps.budget.outputs.run_council == 'true'
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m ai_lab.beta_testers
      - name: Record beta request result
        if: steps.budget.outputs.run_council == 'true'
        run: |
          if [ "${{ steps.beta_request.outcome }}" = "success" ]; then
            python ai_lab/autonomy_guard.py --success || true
          else
            python ai_lab/autonomy_guard.py --failure "beta tester Gemini request failed" || true
            git config user.name "waypoint-autonomy-guard[bot]"
            git config user.email "waypoint-autonomy-guard[bot]@users.noreply.github.com"
            git add runtime/autonomy_guard.json
            git diff --cached --quiet || git commit -m "guard: record autonomous request failure"
            git push origin ai-development
            exit 1
          fi
      - name: Resolve council with World Architect & Cartographer
        id: architect_request
        if: steps.budget.outputs.run_council == 'true'
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m ai_lab.world_architect
      - name: Record architect request result
        if: steps.budget.outputs.run_council == 'true'
        run: |
          if [ "${{ steps.architect_request.outcome }}" = "success" ]; then
            python ai_lab/autonomy_guard.py --success || true
          else
            python ai_lab/autonomy_guard.py --failure "World Architect Gemini request failed" || true
            git config user.name "waypoint-autonomy-guard[bot]"
            git config user.email "waypoint-autonomy-guard[bot]@users.noreply.github.com"
            git add runtime/autonomy_guard.json
            git diff --cached --quiet || git commit -m "guard: record autonomous request failure"
            git push origin ai-development
            exit 1
          fi
      - name: Evaluate milestone locks and cadence
        if: steps.budget.outputs.run_council == 'true'
        run: python -m ai_lab.milestone_governor
      - name: Generate Codex engineering handoff queue
        if: steps.budget.outputs.run_council == 'true'
        run: python -m ai_lab.codex_backlog
      - name: Prepare owner development review bundle
        if: steps.budget.outputs.run_council == 'true'
        run: python -m ai_lab.development_review
      - name: Install test dependencies
        if: steps.budget.outputs.run_council == 'true'
        run: python -m pip install -r requirements-dev.txt
      - name: Run AI lab tests
        if: steps.budget.outputs.run_council == 'true'
        run: python -m pytest tests_ai_lab -q
      - name: Commit governed beta evidence and Codex queue
        if: steps.budget.outputs.run_council == 'true'
        run: |
          git config user.name "waypoint-beta-council[bot]"
          git config user.email "waypoint-beta-council[bot]@users.noreply.github.com"
          git add beta_feedback runtime/beta_council.json runtime/telemetry_snapshot.json runtime/world_map.json runtime/development_governance.json runtime/autonomy_guard.json runtime/development_review.json runtime/gemini_daily_usage.json reports/BETA_COUNCIL_LATEST.md reports/WORLD_ARCHITECT_LATEST.md reports/DEVELOPMENT_GOVERNANCE.md codex_backlog
          git diff --cached --quiet && exit 0
          git commit -m "ai: governed beta council and milestone handoff"
          git push origin ai-development
